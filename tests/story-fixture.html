<!doctype html><html lang="en"><meta charset="utf-8"><title>Story repair interaction fixture</title>
<link rel="stylesheet" href="/extension/css/stories.css">
<style>body{margin:0;background:#202124;color:#eee;font:15px system-ui}nav{position:absolute;left:480px;top:40px;display:grid;gap:10px}button{padding:10px}#viewer{position:absolute;left:32px;top:25px;width:360px;height:640px;background:#101b2b;border-radius:12px;overflow:hidden}#viewer img,#viewer video{width:360px;height:640px}#viewer header{position:absolute;top:20px;left:18px}pre{max-width:700px;white-space:pre-wrap}</style>
<nav><h1>Story repair interaction fixture</h1><button id="open">Open story</button><button id="highlight">Open highlight with HTTP 500 metadata</button><button id="next">Next story</button><button id="replace">Replace viewer controls</button><button id="leave">Leave stories</button><pre id="result">No downloads</pre><pre id="events">Viewer clicks: 0</pre><pre id="requests">Metadata requests: 0</pre></nav>
<script>
let fixtureId='123',viewerClicks=0,fixtureHighlight=false,metadataCalls=0;
const picture='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640"><rect width="360" height="640" fill="#172d40"/><circle cx="235" cy="240" r="80" fill="#55d9cc"/><path d="M0 640V450L180 300 360 500V640" fill="#31576d"/><text x="25" y="590" fill="white" font-family="sans-serif" font-size="20">Synthetic story fixture</text></svg>');
function loadedItem(id){return {id,pk:id,user:{username:'example'},media_type:2,taken_at:1000,image_versions2:{candidates:[{url:'https://scontent.cdninstagram.com/'+id+'.jpg',width:1080,height:1920}]},video_versions:[{url:'https://scontent.fbcdn.net/'+id+'.mp4',width:1080,height:1920}]}}
function show(){let viewer=document.getElementById('viewer');if(!viewer){viewer=document.createElement('div');viewer.id='viewer';viewer.onclick=()=>{viewerClicks++;document.getElementById('events').textContent='Viewer clicks: '+viewerClicks};document.body.appendChild(viewer)}viewer.innerHTML='<img alt="Story scene" src="'+picture+'"><header>example · story '+fixtureId+'</header>';if(fixtureHighlight){viewer.innerHTML='<video poster="'+picture+'"></video><header>Synthetic highlight · 37w</header>';const video=viewer.querySelector('video');video.src=URL.createObjectURL(new Blob(['synthetic video placeholder'],{type:'video/mp4'}));video.__reactFiber$fixture={memoizedProps:{currentStory:loadedItem(fixtureId),reel:{id:'highlight:12',user:{username:'example'},items:[loadedItem('123'),loadedItem('456')]}}}}}
document.getElementById('open').onclick=()=>{fixtureHighlight=false;history.pushState({},'', '/stories/example/123/');fixtureId='123';show()};
document.getElementById('highlight').onclick=()=>{fixtureHighlight=true;metadataCalls=0;document.getElementById('requests').textContent='Metadata requests: 0 (endpoint would return HTTP 500)';history.pushState({},'', '/stories/highlights/12/');fixtureId='123';show()};
document.getElementById('next').onclick=()=>{if(!fixtureHighlight)history.pushState({},'', '/stories/example/456/');fixtureId='456';show()};
document.getElementById('replace').onclick=()=>{document.getElementById('lwl-story-downloads')?.remove();show()};
document.getElementById('leave').onclick=()=>{history.pushState({},'', '/tests/story-fixture.html');document.getElementById('viewer')?.remove()};
globalThis.__turboLocalRepair={headers:()=>({appId:'fixture',wwwClaim:'0'}),open:async()=>({id:'999'})};
globalThis.__lwlBrowserDownloads={download:async(items,account,progress)=>{document.getElementById('result').textContent=JSON.stringify({ids:items.map(item=>item.id),urls:items.map(item=>item.url),username:account.username});await progress(items.length,items.length)}};
window.fetch=async url=>{metadataCalls++;document.getElementById('requests').textContent='Metadata requests: '+metadataCalls;if(fixtureHighlight)return {status:500,ok:false,url,json:async()=>({status:'fail'})};const id=url.match(/media\/(\d+)\/info/)[1];return {status:200,ok:true,url,json:async()=>({items:[{pk:Number(id),id:id+'_999',media_type:1,user:{username:'example'},image_versions2:{candidates:[{width:1080,height:1920,url:'https://scontent.cdninstagram.com/'+id+'.jpg'}]}}]})}};
</script>
<script src="/extension/js/story-page.js"></script>
<script src="/extension/js/stories.js"></script>
</html>
